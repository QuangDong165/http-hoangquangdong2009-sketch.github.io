<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#070b0d">
  <meta name="description" content="Trang bio cá nhân của Hoàng Quảng Đông — kết nối qua mạng xã hội và điện thoại.">
  <title>Hoàng Quảng Đông — Bio</title>
  <style>
    :root {
      color-scheme: dark light;
      --bg: #070b0d;
      --surface: #0d1518;
      --surface-hover: #112126;
      --text: #efffff;
      --muted: #8da7ad;
      --accent: #35f2c1;
      --accent-2: #00b8d9;
      --line: rgba(53, 242, 193, .25);
      --shadow: rgba(0, 235, 186, .13);
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; background: var(--bg); }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(ellipse at 50% 0%, rgba(0, 184, 217, .12), transparent 42%),
        radial-gradient(ellipse at 10% 65%, rgba(53, 242, 193, .06), transparent 35%),
        var(--bg);
      display: grid;
      place-items: center;
      padding: 28px 16px;
      overflow-x: hidden;
    }
    .ambient { position: fixed; width: 230px; height: 230px; border-radius: 50%; filter: blur(85px); opacity: .14; pointer-events: none; animation: drift 9s ease-in-out infinite alternate; }
    .ambient.one { background: var(--accent); top: 8%; left: -120px; }
    .ambient.two { background: var(--accent-2); right: -130px; bottom: 8%; animation-delay: -4s; }
    .page { position: relative; width: min(100%, 440px); animation: rise .7s cubic-bezier(.2,.7,.2,1) both; }
    .card {
      border: 1px solid var(--line);
      border-radius: 28px;
      padding: 30px 22px 23px;
      background: linear-gradient(155deg, rgba(16, 30, 34, .96), rgba(7, 13, 16, .98) 65%);
      box-shadow: 0 0 0 1px rgba(255,255,255,.015), 0 24px 80px rgba(0,0,0,.42), 0 0 42px var(--shadow);
      backdrop-filter: blur(12px);
    }
    .profile { text-align: center; }
    .avatar-wrap { width: 118px; height: 118px; margin: 0 auto 19px; position: relative; isolation: isolate; filter: drop-shadow(0 0 12px rgba(53,242,193,.2)); transition: filter .35s ease, transform .35s ease; }
    .avatar-wrap::after { content: ""; position: absolute; inset: -13px; border-radius: 50%; border: 1px solid rgba(0,184,217,.25); opacity: .65; z-index: -1; animation: orbitGlow 5s ease-in-out infinite; }
    .avatar-wrap:hover { transform: scale(1.045); filter: drop-shadow(0 0 22px rgba(53,242,193,.48)); }
    .avatar-wrap:hover::before { box-shadow: 0 0 32px rgba(53,242,193,.48); }
    .avatar-wrap::before { content: ""; position: absolute; inset: -6px; border-radius: 50%; border: 1px solid rgba(53,242,193,.48); box-shadow: 0 0 22px rgba(53,242,193,.16); animation: pulse 3s ease-in-out infinite; }
    .avatar { width: 100%; height: 100%; display: grid; place-items: center; overflow: hidden; border-radius: 50%; border: 2px solid var(--accent); background: linear-gradient(140deg, #123b3d, #101820 60%, #063c4a); color: var(--accent); box-shadow: 0 0 18px rgba(53,242,193,.22), inset 0 0 18px rgba(0,184,217,.12); transition: box-shadow .35s ease, border-color .35s ease; }
    .avatar-wrap:hover .avatar { border-color: #a0ffe9; box-shadow: 0 0 28px rgba(53,242,193,.5), 0 0 54px rgba(0,184,217,.2), inset 0 0 20px rgba(0,184,217,.2); }
    .avatar svg { width: 54px; height: 54px; }
    .avatar img { display: none; width: 100%; height: 100%; object-fit: cover; }
    h1 { margin: 0; font-size: clamp(25px, 6vw, 30px); letter-spacing: -.7px; font-weight: 760; display: inline-block; color: #f2ffff; text-shadow: 0 0 14px rgba(53,242,193,.16); transition: transform .3s ease, text-shadow .3s ease, color .3s ease; }
    h1:hover { transform: translateY(-2px) scale(1.025); color: #ffffff; text-shadow: 0 0 7px rgba(53,242,193,.65), 0 0 22px rgba(53,242,193,.38); }
    .eyebrow { color: var(--accent); text-transform: uppercase; letter-spacing: 3px; font-size: 10px; font-weight: 800; margin-top: 9px; }
    .bio { color: var(--muted); font-size: 13px; line-height: 1.6; margin: 13px auto 25px; max-width: 290px; }
    .links { display: grid; gap: 11px; }
    .link {
      display: flex; align-items: center; gap: 13px; min-height: 64px; padding: 12px 15px;
      color: var(--text); text-decoration: none; border: 1px solid rgba(53,242,193,.2); border-radius: 16px;
      background: rgba(13, 27, 31, .82); transition: transform .2s ease, border-color .2s ease, background .2s ease, box-shadow .2s ease;
    }
    .link:hover, .link:focus-visible { transform: translateY(-2px); border-color: rgba(53,242,193,.75); background: var(--surface-hover); box-shadow: 0 8px 24px rgba(0,0,0,.22), 0 0 20px rgba(53,242,193,.08); outline: none; }
    .link-icon { width: 39px; height: 39px; display: grid; place-items: center; border-radius: 12px; color: var(--accent); background: rgba(53,242,193,.09); flex: 0 0 auto; }
    .link-icon svg { width: 21px; height: 21px; }
    .link-copy { min-width: 0; flex: 1; }
    .link-title { display: block; font-size: 14px; font-weight: 700; }
    .link-sub { display: block; color: var(--muted); font-size: 11px; margin-top: 4px; overflow-wrap: anywhere; }
    .arrow { color: #6d9d9a; font-size: 20px; padding-left: 5px; }
    .section-label { display: flex; align-items: center; gap: 10px; color: #80a6a8; text-transform: uppercase; letter-spacing: 2px; font-size: 9px; font-weight: 800; margin: 25px 0 13px; }
    .section-label::before, .section-label::after { content: ""; height: 1px; background: rgba(53,242,193,.17); flex: 1; }
    .socials { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; }
    .social {
      position: relative; overflow: hidden;
      width: 43px; height: 43px; display: grid; place-items: center; border-radius: 14px; border: 1px solid rgba(53,242,193,.24);
      color: var(--accent); background: rgba(53,242,193,.06); text-decoration: none; transition: transform .22s ease, background .22s ease, opacity .2s ease, box-shadow .22s ease, border-color .22s ease;
    }
    .social:not(.disabled):hover { transform: translateY(-4px) scale(1.07); background: rgba(53,242,193,.17); border-color: rgba(53,242,193,.8); box-shadow: 0 7px 22px rgba(53,242,193,.18); }
    .social:not(.disabled):active { transform: translateY(-1px) scale(.92); box-shadow: 0 0 26px rgba(53,242,193,.42); }
    .social:not(.disabled)::after { content: ""; position: absolute; width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,.65); transform: scale(0); opacity: 0; pointer-events: none; }
    .social.tap-pop::after { animation: iconRipple .48s ease-out; }
    .social svg { width: 20px; height: 20px; }
    .social:hover { transform: translateY(-3px); background: rgba(53,242,193,.14); }
    .social.disabled { color: #4d696d; border-color: rgba(141,167,173,.12); opacity: .58; cursor: default; }
    .social.disabled:hover { transform: none; background: rgba(53,242,193,.06); }
    .foot { text-align: center; margin-top: 23px; color: #557276; font-size: 9px; letter-spacing: 2px; }
    .note { color: #6e898d; text-align: center; font-size: 10px; line-height: 1.5; margin: 12px 8px 0; }
    @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes pulse { 0%,100% { transform: scale(1); opacity: .75; } 50% { transform: scale(1.045); opacity: 1; } }
    @keyframes drift { from { transform: translate(0,0); } to { transform: translate(28px,-22px); } }
    @keyframes orbitGlow { 0%,100% { transform: scale(1); opacity: .45; } 50% { transform: scale(1.07); opacity: .9; } }
    @keyframes iconRipple { 0% { transform: scale(1); opacity: .8; box-shadow: 0 0 0 0 rgba(255,255,255,.4); } 100% { transform: scale(9); opacity: 0; box-shadow: 0 0 0 10px rgba(53,242,193,0); } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; } }
    @media (max-width: 360px) { .card { padding: 25px 16px 20px; } .link { padding: 10px 11px; } }
    @media (min-width: 700px) { body { padding: 40px 24px; } .card { padding: 34px 27px 25px; } }
  </style>
</head>
